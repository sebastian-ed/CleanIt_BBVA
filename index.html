<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clean It | BBVA</title><link rel="stylesheet" href="style.css?v=3"></head><body><nav><b>Clean It · BBVA</b><button id="opNav">Operario</button><button id="supNav">Supervisor</button><button id="logout">Salir</button></nav><main><section id="login" class="card narrow"><h1>Ingresar</h1><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="enter" class="primary">Ingresar</button></section><p id="status" role="status"></p><section id="op" hidden class="narrow"><h1>Cargar planilla</h1><div class="card"><label>Fecha<input id="date" type="date"></label><label>Momento<select id="moment"><option value="inicio">Inicio</option><option value="cierre">Cierre</option></select></label><label>Foto de planilla<input id="file" type="file" accept="image/*" capture="environment"></label><img id="preview" hidden><button id="upload" class="primary">Guardar y procesar</button><p>El cierre determina los resultados. El inicio sirve para detectar cambios.</p></div><div class="card"><h2>Mis fotos de la fecha</h2><div id="opHistory"></div><button id="opRefresh">Actualizar fotos</button><button id="goResults" hidden>Ver control y resultados</button></div></section><section id="sup" hidden><h1>Control mensual</h1><div class="card"><div class="row"><label>Mes<input id="month" type="month"></label><button id="refresh">Actualizar</button><button id="csv">Descargar CSV</button></div><div id="kpis" class="kpis"></div><progress id="progress" max="200" value="0"></progress><p id="capacity"></p></div><div class="card"><h2>Evolución diaria</h2><div id="chart"></div></div><div class="layout"><aside class="card"><h2>Días registrados</h2><div id="days"></div></aside><article class="card"><h2 id="title">Seleccioná un día</h2><div id="dayKpis" class="kpis"></div><div id="photos" class="photoGrid"></div><div id="actions" hidden><button id="read" class="primary">Leer / reprocesar con Gemini</button><button id="manual">Cargar manualmente</button><button id="add">Agregar fila</button><label>Tarifa particular del día<input id="price" type="number" min="0" step="0.01"></label><label>Tarifa extra por exceso (estimación mensual)<input id="extraPrice" type="number" min="0" step="0.01"></label><p id="alerts"></p><div class="row"><label>Filtrar detalle<select id="filter"><option value="all">Todos</option><option value="pSI">Particulares realizados</option><option value="pNO">Particulares cancelados</option><option value="aSI">Abonados realizados</option><option value="aNO">Abonados cancelados</option><option value="unknown">Sin resolver</option></select></label></div><div class="scroll"><table><thead><tr><th>Patente</th><th>Cochera</th><th>Tipo</th><th>Realizado</th><th>Quitar</th></tr></thead><tbody id="rows"></tbody></table></div><button id="save">Guardar revisión</button></div></article></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=3"></script></body></html>
